name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: # 只构建并上传 artifact，不建 Release、不上 Play：用于验证签名与构建链路，或手工传内部测试轨道
    inputs:
      version_name:
        description: "版本名（MAJOR.MINOR.PATCH[-后缀]，决定 versionCode）；留空为 0.0.1-ci"
        required: false
        default: ""
      play_track:
        description: "传 Play 哪条轨道：none 只出 artifact；internal 传内部测试轨道（不送审、不写发版说明）"
        type: choice
        options: [none, internal]
        default: none
      ios:
        description: "iOS：none 不构建；testflight 构建、云签名并上传 TestFlight（用 version_name 作版本，构建号同 versionCode）"
        type: choice
        options: [none, testflight]
        default: none

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.vcode.outputs.value }}
    env:
      # App 内置更新说明（手写）：GitHub Release 正文与 Play 发版说明也从它生成
      WHATSNEW_PATH: shared/src/commonMain/composeResources/files/whatsnew.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=${{ github.event.inputs.version_name || '0.0.1-ci' }}" >> $GITHUB_ENV
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.jks" >> $GITHUB_ENV

      # 更新说明只走手写：whatsnew.json 的 version 必须等于本次 tag 且有内容（流程见 CLAUDE.md「写更新说明」）。
      # 正式版不符直接失败，免得发出不弹窗、Play 发版说明为空的版本；预发布只警告
      - name: Check What's New
        if: github.event_name == 'push'
        run: |
          python3 - <<'EOF'
          import json, os
          version = os.environ["VERSION_NAME"]
          try:
              w = json.load(open(os.environ["WHATSNEW_PATH"]))
          except Exception as e:
              w = {}
              print(f"读取 whatsnew.json 失败: {e}")
          has_content = any(isinstance(x, str) and x.strip() for x in w.get("zh", []) + w.get("en", []))
          if w.get("version") == version and has_content:
              print(f"✅ whatsnew.json 就绪: zh={len(w.get('zh', []))} en={len(w.get('en', []))}")
              raise SystemExit(0)
          msg = f"whatsnew.json 未写本版内容（version={w.get('version')}，tag={version}）"
          if "-" in version:
              print(f"⚠️ {msg}，预发布继续，本版不弹窗")
          else:
              print(f"::error::{msg}")
              raise SystemExit(1)
          EOF

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleGithubRelease :androidApp:bundlePlayRelease --no-daemon

      - name: Rename artifacts
        run: |
          cp androidApp/build/outputs/apk/github/release/androidApp-github-release.apk Tono-${VERSION_NAME}.apk
          cp androidApp/build/outputs/bundle/playRelease/androidApp-play-release.aab Tono-${VERSION_NAME}-play.aab

      # versionCode 从构建产物读，公式只在 build.gradle.kts 一处维护；iOS job 拿它当 CFBundleVersion，两端构建号同源
      - name: Read versionCode
        id: vcode
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)
          VCODE=$("$AAPT" dump badging Tono-${VERSION_NAME}.apk | grep '^package:' | sed -n "s/.* versionCode='\([0-9]*\)'.*/\1/p")
          [ -n "$VCODE" ] || { echo "❌ 读不到 versionCode"; exit 1; }
          echo "value=$VCODE" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VCODE"

      # Release 正文与 App 内更新说明同源；预发布没写 whatsnew 时退回 GitHub 自动生成
      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os
          version = os.environ["VERSION_NAME"]
          try:
              w = json.load(open(os.environ["WHATSNEW_PATH"]))
          except Exception:
              w = {}
          lines = []
          if w.get("version") == version and (w.get("zh") or w.get("en")):
              if w.get("zh"):
                  lines += ["### ✨ 更新内容"] + [f"- {x}" for x in w["zh"]] + [""]
              if w.get("en"):
                  lines += ["### ✨ What's New"] + [f"- {x}" for x in w["en"]] + [""]
          open("release_notes.md", "w").write("\n".join(lines))
          EOF
          if [ -s release_notes.md ]; then NOTES=(--notes-file release_notes.md); else NOTES=(--generate-notes); fi
          gh release create "$VERSION_NAME" Tono-${VERSION_NAME}.apk \
            --title "$VERSION_NAME" "${NOTES[@]}" \
            $([[ "$VERSION_NAME" == *-* ]] && echo --prerelease)

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            Tono-${{ env.VERSION_NAME }}.apk
            Tono-${{ env.VERSION_NAME }}-play.aab

      # 发布到 Google Play 正式轨道：上传 play 渠道 AAB 与本版发版说明（fastlane/metadata/android/*/changelogs/<versionCode>.txt），
      # 上传即送审、过审自动上线。商品详情（文案 / 截图）由 play_listing.yml 同步，这里固定跳过。
      # 密钥经 SUPPLY_JSON_KEY_DATA 环境变量传入（fastlane 原生识别），不落盘。预发布 tag（带 -）不上 Play。
      # 数据安全、内容分级、登录详细信息等政策声明 Play 没有 API，变更时须先在 Play Console 手动改好再打 tag。
      - uses: ruby/setup-ruby@v1
        if: (github.event_name == 'push' && !contains(github.ref_name, '-')) || github.event.inputs.play_track == 'internal'
        with:
          ruby-version: '3.2'

      - name: Publish to Google Play
        if: github.event_name == 'push' && !contains(github.ref_name, '-')
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # 本版 Play 发版说明：仓库里已有 changelogs/<versionCode>.txt 就沿用，否则由 whatsnew.json 生成。
          VCODE="${{ steps.vcode.outputs.value }}"
          python3 - "$VCODE" <<'EOF'
          import json, os, sys
          vcode = sys.argv[1]
          try:
              w = json.load(open(os.environ["WHATSNEW_PATH"]))
          except Exception:
              w = {}
          if w.get("version") != os.environ["VERSION_NAME"]:
              w = {}
          for key, loc in (("zh", "zh-CN"), ("en", "en-US")):
              path = f"fastlane/metadata/android/{loc}/changelogs/{vcode}.txt"
              if os.path.exists(path):
                  print(f"✅ 沿用仓库里的 {path}")
                  continue
              items = [x.strip() for x in w.get(key, []) if isinstance(x, str) and x.strip()]
              if not items:
                  print(f"⚠️ whatsnew.json 无 {key} 内容，{loc} 发版说明留空")
                  continue
              text = ""
              for item in items:
                  line = f"• {item}\n"
                  if len(text) + len(line) > 500:  # Play 单语言上限 500 字符
                      break
                  text += line
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, "w").write(text.rstrip("\n"))
              print(f"✅ 生成 {path}（{len(text)} 字符）")
          EOF

          gem install fastlane --no-document
          fastlane supply --package_name com.tono.android \
            --aab Tono-${VERSION_NAME}-play.aab \
            --track production \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true

      # 手动触发且 play_track=internal：只传内部测试轨道，不送审、不写发版说明。
      # 用于先把带新权限 / 新结算库的包放到 Play 上（如建订阅商品前 Play 要求已有带 BILLING 权限的版本）
      - name: Publish to Google Play (internal track)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.play_track == 'internal'
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          gem install fastlane --no-document
          fastlane supply --package_name com.tono.android \
            --aab Tono-${VERSION_NAME}-play.aab \
            --track internal \
            --skip_upload_apk true \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true

  # iOS：正式 tag 自动跑，workflow_dispatch 选 ios=testflight 手动验证。预发布 tag（带 -）不跑：构建号公式会去掉后缀，与正式版撞号。
  # 版本注入：MARKETING_VERSION（CFBundleShortVersionString）= tag 去掉后缀，CURRENT_PROJECT_VERSION（CFBundleVersion）= Android versionCode，
  # 命令行参数优先级高于 Config.xcconfig，工程文件不动。同一 tag 重传会撞构建号，处理同 Android：打补丁 tag。
  # 签名：Xcode 云签名。-allowProvisioningUpdates + ASC API key（Admin）让 xcodebuild 自建证书与描述文件，不存 .p12、不用 match。
  # 上传：exportArchive 的 destination=upload 直传 App Store Connect，进 TestFlight 后仍手动在 ASC 选 build 提审。
  build-ios:
    if: ${{ !cancelled() && needs.build-android.result == 'success' && ((github.event_name == 'push' && !contains(github.ref_name, '-')) || github.event.inputs.ios == 'testflight') }}
    needs: build-android
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TEAM_ID: TP3A22B9WT
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Kotlin/Native 编译器与平台库约 1GB，不缓存每次冷下载十分钟起
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Prepare version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION_NAME="${{ github.ref_name }}"
          else
            VERSION_NAME="${{ github.event.inputs.version_name || '0.0.1-ci' }}"
          fi
          VCODE="${{ needs.build-android.outputs.version_code }}"
          [ -n "$VCODE" ] || { echo "❌ Android job 没给出 versionCode"; exit 1; }
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "MARKETING_VERSION=${VERSION_NAME%%-*}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$VCODE" >> $GITHUB_ENV
          echo "iOS $VERSION_NAME → CFBundleShortVersionString=${VERSION_NAME%%-*} CFBundleVersion=$VCODE"

      - name: Install ASC API key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Archive
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tono.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tee "$RUNNER_TEMP/archive.log" | grep -E '^(\*\*|error|warning: .*sign|.*error:)' || true
          test -d "$RUNNER_TEMP/Tono.xcarchive" || { echo "❌ archive 失败，日志尾部："; tail -n 80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tono.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "✅ iOS $MARKETING_VERSION ($BUILD_NUMBER) 已上传 App Store Connect，处理完成后出现在 TestFlight"

      - name: Upload archive log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-log
          path: ${{ runner.temp }}/archive.log
