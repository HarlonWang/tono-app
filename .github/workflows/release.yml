name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch: # 只构建并上传 artifact，不建 Release：用于验证签名与构建链路

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # App 内置更新说明：Generate What's New 写它，GitHub Release 正文与 Play 发版说明读它
      WHATSNEW_PATH: shared/src/commonMain/composeResources/files/whatsnew.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=0.0.1-ci" >> $GITHUB_ENV
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks
          echo "ANDROID_KEYSTORE_PATH=$(pwd)/release.jks" >> $GITHUB_ENV

      # 构建前生成面向用户的双语更新说明，覆盖仓库里的占位文件后随包打进去，App 升级后首启据此弹窗。
      # 「自动 / 手动」由内容决定：仓库里 whatsnew.json 的 version 恰等于本次 tag 且 zh/en 至少一个非空
      # → 手动模式，直接采用；否则调 AI 用上个正式版以来的 commit 生成。
      # 生成失败不阻塞发布（保留占位 = 该版本不弹窗）。
      - name: Generate What's New
        if: github.event_name == 'push'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # 只取正式版 tag 作基准（$ 锚定），预发布不当基准
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${VERSION_NAME}$" | head -n 1)
          if [ -n "$PREVIOUS_TAG" ]; then
            git log "$PREVIOUS_TAG"..HEAD --no-merges --oneline > commit_logs.txt
          else
            git log --no-merges --oneline -n 20 > commit_logs.txt
          fi

          python3 - <<'EOF'
          import json, os, urllib.request

          version = os.environ["VERSION_NAME"]
          target = os.environ["WHATSNEW_PATH"]
          commits = open("commit_logs.txt").read().strip()

          existing = {}
          try:
              existing = json.load(open(target))
          except Exception as e:
              print(f"⚠️ 读取 whatsnew.json 失败: {e}")
          has_content = any(isinstance(x, str) and x.strip() for x in existing.get("zh", []) + existing.get("en", []))
          if existing.get("version") == version and has_content:
              print("✅ 使用本地手写的更新说明，跳过 AI")
              raise SystemExit(0)
          if has_content:
              print(f"⚠️ 本地 whatsnew.json 有内容但版本({existing.get('version')})与 tag({version})不符，由 AI 覆盖")

          api_key = os.environ.get("OPENAI_API_KEY", "")
          if not commits or not api_key:
              print("⚠️ 缺 commit 记录或 OPENAI_API_KEY，保留占位（本版不弹窗）")
              raise SystemExit(0)

          prompt = (
              "请根据以下 git commit 记录，为一款 AI 聊天 App（Tono）生成面向普通用户的版本更新说明。\n"
              "要求：\n"
              "1. 过滤纯内部改动（构建、CI、打包、签名、依赖升级、重构、测试、文档），以及用户无直接感知的能力（统计、埋点、渠道识别、版本分发、监控、日志），只保留用户可感知的新功能、优化和修复。\n"
              "2. 每条一句话，简洁明了，不要堆砌技术术语；中文 3-6 条，英文为对应翻译。若没有用户可感知的改动，输出一条「稳定性与体验优化」。\n"
              "3. 严格输出 JSON 对象：{\"zh\": [\"...\"], \"en\": [\"...\"]}，不要输出任何其他内容。\n\n"
              f"Commits:\n{commits}"
          )
          req = urllib.request.Request(
              "https://api.openai.com/v1/chat/completions",
              data=json.dumps({
                  "model": "gpt-5.4",
                  "messages": [{"role": "user", "content": prompt}],
                  "response_format": {"type": "json_object"},
              }).encode(),
              headers={"Content-Type": "application/json", "Authorization": f"Bearer {api_key}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  content = json.loads(json.loads(r.read())["choices"][0]["message"]["content"])
              zh = [x.strip() for x in content.get("zh", []) if isinstance(x, str) and x.strip()]
              en = [x.strip() for x in content.get("en", []) if isinstance(x, str) and x.strip()]
              if not zh and not en:
                  print("⚠️ 模型返回为空，保留占位")
                  raise SystemExit(0)
              # version 以 tag 为准，不信任模型输出
              json.dump({"version": version, "zh": zh, "en": en}, open(target, "w"), ensure_ascii=False, indent=2)
              print(f"✅ whatsnew.json 已生成: zh={len(zh)} en={len(en)}")
          except SystemExit:
              raise
          except Exception as e:
              print(f"⚠️ 生成失败，保留占位: {e}")
          EOF
          cat "$WHATSNEW_PATH"

      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleGithubRelease :androidApp:bundlePlayRelease --no-daemon

      - name: Rename artifacts
        run: |
          cp androidApp/build/outputs/apk/github/release/androidApp-github-release.apk Tono-${VERSION_NAME}.apk
          cp androidApp/build/outputs/bundle/playRelease/androidApp-play-release.aab Tono-${VERSION_NAME}-play.aab

      # Release 正文与 App 内更新说明同源；whatsnew 不可用时退回原始 commit 记录
      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os
          version = os.environ["VERSION_NAME"]
          try:
              w = json.load(open(os.environ["WHATSNEW_PATH"]))
          except Exception:
              w = {}
          lines = []
          if w.get("version") == version and (w.get("zh") or w.get("en")):
              if w.get("zh"):
                  lines += ["### ✨ 更新内容"] + [f"- {x}" for x in w["zh"]] + [""]
              if w.get("en"):
                  lines += ["### ✨ What's New"] + [f"- {x}" for x in w["en"]] + [""]
          else:
              commits = open("commit_logs.txt").read().strip() if os.path.exists("commit_logs.txt") else ""
              lines += ["### 变更记录 (Changelog)", "", commits or "* No specific changes.", ""]
          open("release_notes.md", "w").write("\n".join(lines))
          EOF
          gh release create "$VERSION_NAME" Tono-${VERSION_NAME}.apk \
            --title "$VERSION_NAME" --notes-file release_notes.md \
            $([[ "$VERSION_NAME" == *-* ]] && echo --prerelease)

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            Tono-${{ env.VERSION_NAME }}.apk
            Tono-${{ env.VERSION_NAME }}-play.aab

      # 发布到 Google Play 正式轨道：上传 play 渠道 AAB 与本版发版说明（fastlane/metadata/android/*/changelogs/<versionCode>.txt），
      # 上传即送审、过审自动上线。商品详情（文案 / 截图）由 play_listing.yml 同步，这里固定跳过。
      # 密钥经 SUPPLY_JSON_KEY_DATA 环境变量传入（fastlane 原生识别），不落盘。预发布 tag（带 -）不上 Play。
      # 数据安全、内容分级、登录详细信息等政策声明 Play 没有 API，变更时须先在 Play Console 手动改好再打 tag。
      - uses: ruby/setup-ruby@v1
        if: github.event_name == 'push' && !contains(github.ref_name, '-')
        with:
          ruby-version: '3.2'

      - name: Publish to Google Play
        if: github.event_name == 'push' && !contains(github.ref_name, '-')
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # 本版 Play 发版说明：仓库里已有 changelogs/<versionCode>.txt 就沿用，否则由 whatsnew.json 生成。
          # versionCode 从构建产物读，公式只在 build.gradle.kts 一处维护
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)
          VCODE=$("$AAPT" dump badging Tono-${VERSION_NAME}.apk | grep '^package:' | sed -n "s/.* versionCode='\([0-9]*\)'.*/\1/p")
          [ -n "$VCODE" ] || { echo "❌ 读不到 versionCode"; exit 1; }
          python3 - "$VCODE" <<'EOF'
          import json, os, sys
          vcode = sys.argv[1]
          try:
              w = json.load(open(os.environ["WHATSNEW_PATH"]))
          except Exception:
              w = {}
          if w.get("version") != os.environ["VERSION_NAME"]:
              w = {}
          for key, loc in (("zh", "zh-CN"), ("en", "en-US")):
              path = f"fastlane/metadata/android/{loc}/changelogs/{vcode}.txt"
              if os.path.exists(path):
                  print(f"✅ 沿用仓库里的 {path}")
                  continue
              items = [x.strip() for x in w.get(key, []) if isinstance(x, str) and x.strip()]
              if not items:
                  print(f"⚠️ whatsnew.json 无 {key} 内容，{loc} 发版说明留空")
                  continue
              text = ""
              for item in items:
                  line = f"• {item}\n"
                  if len(text) + len(line) > 500:  # Play 单语言上限 500 字符
                      break
                  text += line
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, "w").write(text.rstrip("\n"))
              print(f"✅ 生成 {path}（{len(text)} 字符）")
          EOF

          gem install fastlane --no-document
          fastlane supply --package_name com.tono.android \
            --aab Tono-${VERSION_NAME}-play.aab \
            --track production \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true
